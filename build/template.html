<!doctype html>
<html lang="en">
$-- The <head> is shared with home.html, in head.html.
$head()$
<body>
<main>
<!-- The title page fills at least one screen. Its content block is centred within it. -->
<section class="title-page">
<div class="title-page-content">
$if(title)$
<h1>$title$</h1>
$endif$
$if(subtitle)$
<p class="subtitle">$subtitle$</p>
$endif$
$titlepage$
</div>
$if(more)$
<svg class="scroll-cue" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
$endif$
</section>
$body$
</main>
$-- The Page runtime for the page's own script, which follows it.
$if(pagescript)$
<script type="module" src="$siteroot$site/scroll.js"></script>
$endif$
$for(include-after)$
$include-after$
$endfor$
</body>
</html>
